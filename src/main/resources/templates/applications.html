<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head}">
</head>
<body>
<header th:replace="~{fragments :: nav}">
</header>
<main>
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<h1>My applications</h1>
<p>Track your progress and manage pending applications.</p>
<div class="empty" th:if="${applications.empty}">No applications yet. <a th:href="@{/jobs}">Explore open jobs</a>
</div>
<article class="card application" th:each="a:${applications}">
<div>
<span class="badge" th:text="${a.status}">
</span>
<h2>
<a th:href="@{/jobs/{id}(id=${a.job.id})}" th:text="${a.job.title}">
</a>
</h2>
<p th:text="${a.job.company}">
</p>
<details>
<summary>Your cover letter</summary>
<p class="prewrap" th:text="${a.coverLetter}">
</p>
</details>
</div>
<form th:if="${a.status.name() == 'SUBMITTED' or a.status.name() == 'REVIEWING'}" th:action="@{/applications/{id}/withdraw(id=${a.id})}" method="post">
<button class="secondary">Withdraw application</button>
</form>
</article>
<div th:replace="~{fragments :: pager(${applications},'/applications')}">
</div>
</main>
<footer>HireHub · Your next chapter starts here.</footer>
</body>
</html>
