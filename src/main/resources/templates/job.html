<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head}">
</head>
<body>
<header th:replace="~{fragments :: nav}">
</header>
<main>
<p class="notice" role="status" th:if="${message}" th:text="${message}">
</p>
<a th:href="@{/jobs}">← All jobs</a>
<div class="detail">
<article class="card">
<p class="eyebrow" th:text="${job.company}">
</p>
<h1 th:text="${job.title}">
</h1>
<p th:text="${job.location}">
</p>
<span class="badge" th:text="${job.active ? 'Open for applications' : 'Closed'}">
</span>
<h2>About this role</h2>
<p class="prewrap" th:text="${job.description}">
</p>
</article>
<aside class="card">
<h2>Apply for this role</h2>
<p th:unless="${job.active}">Applications for this role are closed.</p>
<div th:if="${job.active}">
<p sec:authorize="isAnonymous()">
<a class="button" th:href="@{/login}">Log in to apply</a>
</p>
<p sec:authorize="hasRole('ADMIN')">Use a User account to submit applications.</p>
<form sec:authorize="hasRole('USER')" th:action="@{/applications/job/{id}(id=${job.id})}" method="post">
<label for="coverLetter">Cover letter</label>
<textarea id="coverLetter" name="coverLetter" rows="10" maxlength="5000" required placeholder="Tell the hiring team why you are a good fit.">
</textarea>
<button>Submit application</button>
<p class="muted">One application per role. Track its progress under My applications.</p>
</form>
</div>
</aside>
</div>
</main>
<footer>HireHub · Your next chapter starts here.</footer>
</body>
</html>
