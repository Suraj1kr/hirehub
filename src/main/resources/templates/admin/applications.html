<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><p class="eyebrow">ADMIN WORKSPACE</p><h1>Review applicants</h1><p>Review each cover letter and update the application status.</p><div class="empty" th:if="${applications.empty}">No applications received yet.</div><article class="card" th:each="a:${applications}"><span class="badge" th:text="${a.status}"></span><h2 th:text="${a.job.title}"></h2><p><strong th:text="${a.user.name}"></strong> · <span th:text="${a.user.email}"></span></p><details><summary>Read cover letter</summary><p class="prewrap" th:text="${a.coverLetter}"></p></details><form class="status-form" th:if="${a.status.name() == 'SUBMITTED' or a.status.name() == 'REVIEWING'}" th:action="@{/admin/applications/{id}/status(id=${a.id})}" method="post"><label th:for="|status-${a.id}|">Update status</label><select th:id="|status-${a.id}|" name="status"><option value="REVIEWING">Reviewing</option><option value="ACCEPTED">Accepted</option><option value="REJECTED">Rejected</option></select><button>Save status</button></form></article><div th:replace="~{fragments :: pager(${applications},'/admin/applications')}"></div></main><footer>HireHub · Your next chapter starts here.</footer></body></html>
