spring.application.name=HireHub
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hirehub}
spring.datasource.username=${DB_USERNAME:hirehub}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
hirehub.admin.email=${ADMIN_EMAIL:}
hirehub.admin.password=${ADMIN_PASSWORD:}
